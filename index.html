<style>
/* Layout: one phone-width app column, scoreboard-condensed numerals, court-orange as the single loud colour */
:root{
  --bg:#E8EBEE; --surface:#FFFFFF; --surface-2:#F3F5F7; --ink:#12161C; --muted:#5A646E; --line:#D2D8DE;
  --accent:#DD5418; --accent-ink:#FFFFFF; --accent-soft:#FBE4D8;
  --court:#1E3A5E; --court-soft:#DDE6F1; --fig:#C9D1D9; --fig-line:#AAB4BE;
  --good:#1D7A4C; --good-soft:#DDF1E6; --bad:#B93A2C; --bad-soft:#F8DEDA; --warn:#9A6514; --warn-soft:#F6EAD3;
  --display:'Karantina','Heebo',system-ui,sans-serif; --body:'Heebo',system-ui,-apple-system,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1317; --surface:#181D23; --surface-2:#20262D; --ink:#EDF0F3; --muted:#98A2AC; --line:#2C343D;
  --accent:#FF7A3D; --accent-ink:#1A0D06; --accent-soft:#3A2418; --court:#93B6E3; --court-soft:#1B2939; --fig:#323B45; --fig-line:#46515D;
  --good:#52C68F; --good-soft:#163326; --bad:#F27A6C; --bad-soft:#3B1E1A; --warn:#E3B45A; --warn-soft:#3A2E17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1317; --surface:#181D23; --surface-2:#20262D; --ink:#EDF0F3; --muted:#98A2AC; --line:#2C343D;
  --accent:#FF7A3D; --accent-ink:#1A0D06; --accent-soft:#3A2418; --court:#93B6E3; --court-soft:#1B2939; --fig:#323B45; --fig-line:#46515D;
  --good:#52C68F; --good-soft:#163326; --bad:#F27A6C; --bad-soft:#3B1E1A; --warn:#E3B45A; --warn-soft:#3A2E17; color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body.has-bg{background:var(--bgimg) fixed;background-size:cover}
body.has-bg .onbg,body.has-bg .onbg .muted,body.has-bg .onbg .eyebrow,body.has-bg .onbg .sync{color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.45)}
.av{position:relative;width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--ink);font-weight:800;border:0;padding:0;overflow:visible}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av.big{width:112px;height:112px;font-size:40px}
.av.f-silver{box-shadow:0 0 0 3px #d9dde3,0 0 0 5px #8b939c}
.av.f-gold{box-shadow:0 0 0 3px #ffd56a,0 0 0 6px #c9901a,0 0 14px rgba(255,190,60,.6)}
.av.f-diamond{box-shadow:0 0 0 3px #bdf3ff,0 0 0 6px #5fb8ff,0 0 18px rgba(120,220,255,.85)}
.av .bdg{position:absolute;bottom:-4px;left:-6px;font-size:16px;line-height:1;background:var(--surface);border-radius:999px;padding:2px 4px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.av.big .bdg{font-size:26px;bottom:-2px;left:-4px}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:800;background:var(--surface);border-radius:999px;padding:6px 12px;font-size:15px;border:0}
.streak.cold{opacity:.65}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rw{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12px;min-height:92px}
.rw .ic{font-size:28px;line-height:1}
.rw.locked{opacity:.45;filter:grayscale(1)}
.rw[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.rw .sw{width:100%;height:28px;border-radius:8px}
.live{position:fixed;inset:0;z-index:70;background:#000;color:#fff;overflow:hidden}
.live video,.live canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.live #liveBg{display:none}.live.whole #liveBg{display:block}
.live.mirror video,.live.mirror canvas{transform:scaleX(-1)}
.live #liveBg{object-fit:cover;filter:blur(22px) brightness(.5);transform:scale(1.15)}.live.mirror #liveBg{transform:scale(-1.15,1.15)}
.live-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(0,0,0,.55),transparent)}
.live-top .x{background:rgba(255,255,255,.18);color:#fff}
.live-top .chip{background:rgba(255,255,255,.18);color:#fff;border-color:transparent}
.live-name{font-weight:800;font-size:18px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.live-hud{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));inset-inline-start:max(14px,env(safe-area-inset-right,0px));text-shadow:0 2px 10px rgba(0,0,0,.7)}
.live-big{font-family:var(--display);font-size:84px;font-weight:700;line-height:.9}
.live-sub{font-size:14px;font-weight:700;opacity:.9}
.upd{position:fixed;inset:0;z-index:90;background:rgba(232,235,238,.97);display:grid;place-items:center;padding:24px}.upd-box{max-width:340px;text-align:center;display:flex;flex-direction:column;gap:10px}.upd-spin{font-size:46px;animation:spin 1.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.live-msg.warn{background:rgba(214,150,20,.85)}
.live-msg{position:absolute;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom,0px));text-align:center;font-size:20px;font-weight:800;padding:10px 14px;border-radius:14px;background:rgba(0,0,0,.55)}
.live-msg.good{background:rgba(29,122,76,.85)}
.live-msg.bad{background:rgba(185,58,44,.85)}
.live-bottom{position:absolute;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,rgba(0,0,0,.6))}
.exgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.exgrid .sport{min-height:0;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.totals{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.tot{background:var(--surface-2);border-radius:14px;padding:10px 12px}.tot .disp{font-size:40px;line-height:1}
.fixc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}.fixc summary{cursor:pointer;list-style-position:inside}.fixc[open] summary{margin-bottom:6px}.fixc .small{margin-top:4px}
.drillc{background:var(--accent-soft)}.exgrid .disp{font-size:17px;line-height:1.2}
.exgrid .sport{min-height:0;padding:12px 8px;text-align:center;align-items:center}
.exgrid .sport .disp{font-size:24px}
.celebrate{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0}
.celebrate .ic{font-size:72px;line-height:1}
@media (prefers-reduced-motion:no-preference){.celebrate .ic{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}}}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px;min-height:100%}
h1,h2,h3{margin:0;text-wrap:balance}
.disp{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:.95}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.block{width:100%}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);letter-spacing:.04em}
.tag.demo{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--good-soft);color:var(--good)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
textarea,input[type=text],input[type=time],input[type=email]{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;resize:vertical}
.hidden{display:none!important}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px;gap:8px}
.brand{white-space:nowrap;font-family:var(--display);font-size:22px;font-weight:700;line-height:1}
.brand b{color:var(--accent)}
.ai{font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center;color:var(--muted)}
.ai i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:block}
.ai.on i{background:var(--good)}
.sync{font-size:12px;font-weight:700;color:var(--muted);margin:-8px 0 12px}.sync[data-s=cloud]{color:var(--good)}.sync[data-s=error],.sync[data-s=full]{color:var(--bad)}
.acct{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r);padding:12px}.acct img{width:40px;height:40px;border-radius:50%}

/* login / onboarding */
.hero{padding:40px 0 24px}
.hero .disp{font-size:64px}
.hero .disp span{color:var(--accent)}
.clock{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:13px;padding:5px 10px;border-radius:8px;z-index:30}
.dots{display:flex;gap:6px}
.dots i{height:5px;flex:1;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}
.sportgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sport{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 14px;text-align:right;display:flex;flex-direction:column;gap:4px;min-height:96px}
.sport .disp{font-size:34px}
.sport[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

/* plan */
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task input{width:22px;height:22px;accent-color:var(--accent);margin-top:2px;flex:none}
.tick{width:24px;height:24px;border-radius:7px;flex:none;margin-top:2px;background:var(--good);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.tick.off{background:transparent;border:2px solid var(--line)}
.proofbtn{margin-top:6px;border-color:var(--accent);color:var(--accent)}
.proof{display:flex;gap:8px;align-items:center;margin-top:6px;padding:6px;border-radius:10px;background:var(--good-soft)}
.proof.no{background:var(--bad-soft)}
.proof img{width:44px;height:44px;object-fit:cover;border-radius:8px;flex:none}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.t{font-weight:700}
.banner{background:var(--court-soft);color:var(--court);border-radius:10px;padding:10px 12px;font-size:14px}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.coachline{border-right:3px solid var(--accent);padding-right:12px;font-size:15px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1.25fr 1fr;align-items:end;padding:6px max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px))}
.nav button{background:none;border:0;padding:8px 4px;font-size:13px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button svg{width:22px;height:22px}
.nav .pain{background:var(--accent);color:var(--accent-ink);border-radius:16px;margin:-22px 4px 0;padding:10px 4px;box-shadow:0 6px 18px rgba(221,84,24,.35)}

/* chat */
.msgs{display:flex;flex-direction:column;gap:10px;padding-bottom:140px}
.msg{max-width:86%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;min-width:0}
.msg.u{align-self:flex-start;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.msg.a{align-self:flex-end;background:var(--surface);border-bottom-left-radius:4px}
.msg.think{color:var(--muted)}
.composer{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:15;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.composer .in{max-width:480px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.composer .cform{display:flex;gap:8px;align-items:center}
.attach{flex:none;width:46px;height:46px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.msg .frames{margin-bottom:6px}
.addrow{display:flex;gap:8px}.addrow input{flex:1;min-width:0}
.qlabel{font-weight:700;margin-top:4px}
.skip{background:none;border:0;color:var(--muted);font-weight:700;text-decoration:underline;padding:8px}
.stepper{display:flex;align-items:center;gap:12px}.stepper button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:20px;font-weight:700}
.stepper .disp{font-size:40px;min-width:3ch;text-align:center}
.composer input{flex:1;min-width:0;border-radius:999px;background:var(--surface)}
.sugg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.sugg .chip{white-space:nowrap;flex:none}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(8,10,14,.5);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:480px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.x{background:var(--surface-2);border:0;border-radius:50%;width:34px;height:34px;font-size:18px;line-height:1}

/* body map */
.mapwrap{background:var(--surface);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.mapwrap svg{width:100%;max-width:260px;height:auto;max-height:52vh}
.spot{cursor:pointer}
.spot .dot{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2;transition:r .15s}
.spot:hover .dot,.spot:focus .dot{r:12}
.spot.sel .dot{fill:var(--accent)}
.spot:focus{outline:none}
.slider{width:100%;accent-color:var(--accent)}
.painval{font-family:var(--display);font-size:44px;font-weight:700;line-height:1;min-width:2ch;text-align:center}
.flag{display:flex;gap:10px;align-items:center;padding:6px 0}
.flag input{width:20px;height:20px;accent-color:var(--bad)}
.ex{border-top:1px solid var(--line);padding-top:10px}
.ex:first-of-type{border-top:0;padding-top:0}

/* progress */
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs .chip{flex:none}
.metric{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.metric .disp{font-size:56px}
.spark{width:120px;height:44px;flex:none}
.score{display:flex;gap:14px;align-items:center}
.ring{width:84px;height:84px;flex:none}
.frames{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.frames img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;max-width:100%}
ul.clean{margin:0;padding:0 18px 0 0;display:flex;flex-direction:column;gap:4px}
.hist{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);gap:10px}
.hist .s{font-family:var(--display);font-size:32px;font-weight:700;line-height:1}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;max-width:90%;text-align:center}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>

<div id="app" dir="rtl" lang="he"></div>

  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19h16M6 15l4-5 4 3 5-7"/></svg>התקדמות</button>
</div></nav>

  <div class="sugg" id="sugg"></div>

</div></div>

function makeAI(){
  const call=async(input,opts={})=>{
    const raw=typeof input==='string'?[{role:'user',content:input}]:input.map(m=>({role:m.role,content:String(m.content)}));
    const msgs=[];for(const m of raw){const l=msgs[msgs.length-1];if(l&&l.role===m.role)l.content+='\n\n'+m.content;else msgs.push({...m})}
    if(msgs[0]?.role!=='user')msgs.unshift({role:'user',content:'שלום'});
    const images=opts.images?await Promise.all(Array.from(opts.images).slice(0,4).map(prepImage)):[];
    const {data,error}=await SB.functions.invoke('ask-coach',{body:{mode:'chat',messages:msgs,images,json:!!opts.json,max_tokens:opts.max||1200}});
    if(error){const st=error.context?.status;throw{code:st===401?'not_granted':st===429?'rate_limited':'upstream_error',message:error.message}}
    if(data?.error)throw{code:'upstream_error',message:data.error.message||String(data.error)};
    const text=(data?.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
    if(!text)throw{code:'empty_completion'};
    opts.onText?.({text,delta:text});return{text,truncated:data.stop_reason==='max_tokens'}};
  call.json=async(input,opts={})=>{const {text}=await call(input,{...opts,json:true,max:opts.max||1800});const v=parseJSONLoose(text);if(v===undefined)throw{code:'invalid_json',text};return v};
  call.limits=async()=>({images:{maxCount:4}});
  return call}

function sideOf(view,x,k){if(['neck','upperback','lowback'].includes(k))return 'מרכז';const leftScreen=x<100;return view==='front'?(leftScreen?'ימין':'שמאל'):(leftScreen?'שמאל':'ימין')}

   <div class="small muted">${IJ.region?`<b>${esc(REG[IJ.region].n)} ${esc(IJ.side)}</b> · ${esc(REG[IJ.region].t)}`:'לחץ על הנקודה הכי קרובה לכאב'}</div></div>

   <p class="small muted">האפליקציה מכוונת ולא מאבחנת. במקרה של ספק, פנה לרופא או לפיזיותרפיסט.</p>`);

   const sides=['neck','upperback','lowback'].includes(IJ.region)?'':`<div class="stack"><div class="t">איזה צד?</div><div class="row">${chips(['ימין','שמאל','שניהם'],'side',false)}</div></div>`;

   ${sides}
   <div class="stack"><div class="t">מה אתה מרגיש?</div><div class="row">${chips(SYMPTOMS[IJ.region]||[],'sym',true)}</div></div>
   <div class="stack"><div class="t">משהו אחר? ספר במילים שלך מה קרה</div><textarea id="injOther" rows="3" placeholder="למשל: נפלתי על היד בבולדר, ומאז כואב כשאני נשען עליה">${esc(IJ.other||'')}</textarea></div>
   <div class="stack"><div class="t">באיזו תנועה זה כואב?</div><div class="row">${chips(MOVES,'move',true)}</div></div>
   <div class="stack"><div class="t">מה מקל?</div><div class="row">${chips(RELIEF,'relief',true)}</div></div>
   <div class="stack"><div class="t">כמה חזק?</div><div class="row" style="flex-wrap:nowrap"><input class="slider" type="range" min="1" max="10" id="painR" value="${IJ.pain}" data-act="painr"><span class="painval" id="painV">${IJ.pain}</span></div></div>
   <div class="stack"><div class="t">מתי זה התחיל?</div><div class="row">${chips(SINCE,'since',false)}</div></div>
   <div class="card" style="background:var(--bad-soft)"><div class="t" style="color:var(--bad)">יש אחד מאלה?</div>${FLAGS.map((f,i)=>`<label class="flag"><input type="checkbox" id="flag${i}" data-act="flag" data-v="${esc(f)}" ${IJ.flags.includes(f)?'checked':''}>${esc(f)}</label>`).join('')}</div>
   <div class="row"><button class="btn ghost" data-act="injback">חזרה</button><button class="btn" style="flex:1" data-act="injgo">מה עושים?</button></div>`)}
  if(s===2)return sheet(`${head(esc(REG[IJ.region].n+' '+IJ.side),'בודק…')}<p class="muted">המאמן מצליב את מה שסיפרת עם התוכנית שלך…</p>`);
  const r=IJ.result;
  if(IJ.red)return sheet(`${head('חשוב','לבדיקה אצל איש מקצוע')}
   <div class="card" style="background:var(--bad-soft);color:var(--bad)"><div class="t">${IJ.flags.length?'סימנת: '+esc(IJ.flags.join(', ')):'רמת כאב '+IJ.pain+'/10'}</div><div>במצב כזה לא נותנים תרגילים מהאפליקציה. כדאי לפנות לרופא או לפיזיותרפיסט, ובמקרה של כאב חריף או פציעה אחרי נפילה, למוקד או לחדר מיון.</div></div>
   <div class="card"><div class="t">עד הבדיקה</div><ul class="clean"><li>מנוחה מכל תנועה שמכאיבה</li><li>אפשר להמשיך באימון של אזורים אחרים שלא מעורבים</li><li>אחרי הבדיקה, ספר למאמן מה אמרו והתוכנית תותאם</li></ul></div>
   <button class="btn block" data-act="injsave">שמור למעקב וסגור</button>`);
  return sheet(`${head(esc(REG[IJ.region].n+' '+IJ.side),'התוכנית לפציעה')}
   ${r.demo?'<span class="tag demo" style="align-self:flex-start">מצב הדגמה</span>':''}
   <div class="card"><div class="eyebrow">מה כנראה קורה</div><div class="t">${esc(r.likely)}</div><div class="small">${esc(r.explain)}</div><div class="small muted">זו הכוונה, לא אבחנה.</div></div>
   <div class="card"><div class="eyebrow">שחרור</div>${(r.release||[]).map(x=>`<div class="ex"><div class="t">${esc(x.name)}</div><div class="small muted">${esc(x.how)}</div></div>`).join('')}</div>
   <div class="card"><div class="eyebrow">חיזוק</div>${(r.strengthen||[]).map(x=>`<div class="ex"><div class="t">${esc(x.name)}</div><div class="small muted">${esc(x.how)}</div></div>`).join('')}</div>
   <div class="card"><div class="eyebrow">שינויים באימונים שלך</div><ul class="clean">${(r.adjust||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
   <div class="banner">${esc(r.recheck||'אם אין שיפור תוך שבועיים, או שזה מחמיר, לך לבדיקה.')}</div>
   <button class="btn block" data-act="injsave">שמור למעקב</button>`)}
function localInj(){const reg=IJ.region,sp=S.sports.map(k=>SPORTS[k].name).join(', ');
  if(reg==='elbow')return{demo:true,likely:'עומס יתר על גידי מכופפי שורש כף היד (מרפק גולף)',explain:'נפוץ אצל מטפסים ובמתח ולחיצות עם אחיזה חזקה. הגידים מתחברים לבליטה הפנימית של המרפק ומתעצבנים מעומס שעולה מהר מדי.',
   release:[{name:'עיסוי אמה עם כדור',how:'2 דק׳, לחץ עדין על השריר מתחת למרפק (לא על הגיד עצמו)'},{name:'מתיחת מכופפי שורש כף יד',how:'יד ישרה קדימה, כף יד למעלה, משוך אצבעות עדינות לאחור. 3×30 שנ׳'}],
   strengthen:[{name:'כפיפת שורש כף יד אקסצנטרית',how:'משקולת 1-3 ק״ג, ירידה של 4 שנ׳. 3×15, כל יום. כאב עד 3/10 זה בסדר'},{name:'החזקה איזומטרית',how:'לחיצה על כדור/גומי 45 שנ׳ ×5, ב-50% כוח'}],
   adjust:['בלי אחיזות קטנות (crimp) ובלי בולדרים קשים לשבועיים','מתח רק באחיזה רחבה, בלי מתח צר','רגליים וליבה כרגיל, אפילו יותר'],recheck:'אם אחרי שבועיים אין שיפור, או שהכאב מעיר אותך בלילה, לך לפיזיותרפיסט.'};
  return{demo:true,likely:`עומס יתר באזור ה${REG[reg].n}`,explain:`הרקמות שכנראה מעורבות: ${REG[reg].t}. ברוב המקרים זה עומס שעלה מהר מדי, ולא קרע.`,
   release:[{name:'תנועה עדינה בטווח שלא כואב',how:'2-3 פעמים ביום, 2 דק׳'},{name:'שחרור השרירים מסביב',how:'כדור או רולר, 90 שנ׳ לכל צד, לא על המקום הכואב עצמו'}],
   strengthen:[{name:'החזקות איזומטריות',how:'5×30 שנ׳ בעצימות בינונית, בלי כאב מעל 3/10'},{name:'חיזוק הדרגתי',how:'אחרי 4-5 ימים בלי החמרה: תנועה מלאה עם משקל קל, 3×12'}],
   adjust:[`להוריד את מה שמכאיב ב${sp} לשבוע`,'להמשיך לאמן את שאר הגוף כרגיל'],recheck:'אם אין שיפור תוך שבועיים, או שזה מחמיר, לך לבדיקה.'}}
async function runInj(){IJ.red=IJ.flags.length>0||IJ.pain>=8;if(IJ.red){IJ.step=3;IJ.result={};return renderInj()}
  IJ.step=2;renderInj();let r;
  if(AI){try{r=await AI.json(`אתה מאמן ספורט צמוד עם ידע בשיקום פציעות ספורט נפוצות (לא רופא). מתאמן שעוסק ב: ${S.sports.map(k=>SPORTS[k].name).join(', ')} מדווח:
אזור: ${REG[IJ.region].n} (${IJ.side||'מרכז'}), רקמות אפשריות: ${REG[IJ.region].t}.
מה מרגיש: ${(IJ.sym||[]).join(', ')||'לא צוין'}. ${IJ.other?'תיאור במילים שלו: "'+IJ.other+'". ':''}כואב בתנועה: ${IJ.move.join(', ')||'לא צוין'}. מקל: ${IJ.relief.join(', ')||'לא צוין'}. עוצמה: ${IJ.pain}/10. התחיל: ${IJ.since||'לא צוין'}. אין סימנים אדומים.
תוכנית האימונים שלו היום: ${planItems().items.map(x=>x[0]).join(' | ')}.
אם התיאור במילים שלו מעיד על סימן אדום (נפילה קשה, עיוות, חוסר תחושה, לא מצליח לדרוך), כתוב ב-likely שצריך בדיקה אצל רופא, ואל תיתן תרגילי חיזוק.
החזר רק JSON בעברית: {"likely":"מה כנראה קורה, ניסוח של 'כנראה', שורה אחת","explain":"2 משפטים פשוטים","release":[{"name":"","how":"מינון"}],"strengthen":[{"name":"","how":"מינון"}],"adjust":["שינויים ספציפיים באימונים שלו, עד 3"],"recheck":"מתי לגשת לפיזיותרפיסט"}. 2 תרגילי שחרור, 2 חיזוק.`,{modelTier:'default'})}catch(e){toast(aiFail(e));r=localInj()}}
  else{await wait(900);r=localInj()}
  IJ.result=r;IJ.step=3;renderInj()}
function saveInj(){const ex=S.injuries.find(i=>i.id===IJ.id);const rec={id:IJ.id||Date.now(),region:IJ.region,side:IJ.side||'מרכז',sym:IJ.sym||[],other:IJ.other||'',move:IJ.move,relief:IJ.relief,pain:IJ.pain,since:IJ.since,flags:IJ.flags,result:IJ.result,red:IJ.red,date:today(),active:true};
  if(ex)Object.assign(ex,rec);else S.injuries.push(rec);save();closeSheet();render();toast('נשמר. המאמן יבדוק איתך מחר')}

  if(!r){await wait(800);r={summary:'יום שנספר. עשית חלק מהתוכנית ודיווחת, וזה העיקר.',win:rep.win?`הצלחת: ${rep.win}. זה בדיוק מה שבונה עקביות.`:'דיווחת, וזה כבר צעד.',tomorrow:[...(SPORTS[S.first].plan.slice(0,2).map(([t,d])=>({title:t,detail:d}))),...(rep.focus?[{title:'פוקוס: '+rep.focus,detail:'15 דק׳ ממוקדות בתחילת האימון'}]:[]),{title:'שינה',detail:'מסך כבוי חצי שעה לפני'}],note:'מחר: קצת פחות, אבל עד הסוף.',demo:true}}

   <div class="eyebrow">מחר</div><ul class="clean">${rep.tomorrow.map(x=>`<li><b>${esc(x.title)}</b>: ${esc(x.detail)}</li>`).join('')}</ul><div class="small muted">${esc(r.note)}</div></div>
   <button class="btn block ghost" data-act="closereport">סגור</button>`;render()}

async function scanFood(f){const out=$('#foodOut');const desc=($('#foodText')?.value||'').trim();if(!f&&!desc){toast('כתוב מה אכלת או צלם את הצלחת');return}const t=f?await thumb(f):null;out.innerHTML=`${t?`<img src="${t}" style="border-radius:10px;width:120px" alt="">`:''}<p class="muted">מעריך…</p>`;let r;

  else{await wait(900);r={items:[{name:'חזה עוף',amount:'150 גר׳',kcal:250,protein:46},{name:'אורז',amount:'כוס',kcal:240,protein:5},{name:'סלט',amount:'קערה',kcal:60,protein:2}],kcal:550,protein:53,note:'ארוחה טובה אחרי אימון. מצב הדגמה: התוצאה לא מבוססת על מה ששלחת.',demo:true}}
  const meal={name:desc||(r.items||[]).map(x=>x.name).slice(0,3).join(', ')||'ארוחה',kcal:Math.round(Number(r.kcal)||0),protein:Math.round(Number(r.protein)||0),thumb:t,time:new Date().toTimeString().slice(0,5)};
  (S.meals[today()]||(S.meals[today()]=[])).push(meal);save();render();

   ${(r.items||[]).map(x=>`<div class="hist"><div><div class="t">${esc(x.name)}</div><div class="small muted">${esc(x.amount)}</div></div><span class="num small">${Math.round(x.kcal)}</span></div>`).join('')}<div class="small muted">${esc(r.note)}</div></div>`}

  case'pick':{const k=t.dataset.k;S.sports=S.sports.includes(k)?S.sports.filter(x=>x!==k):[...S.sports,k];if(S.sports.length===1)S.first=S.sports[0];save();render();break}

  case'next':{keepText();const id=steps()[S.onbStep];
    if(id==='areas'){const c=$('#areaIn')?.value;if(c)addArea(c)}

    const fo=focusOpts();if(!fo.some(o=>o.k===S.focus))S.focus=fo[0]?.k||'';
    if(id==='areas'&&S.areas.includes('sport')&&!S.sports.length){S.onbStep++;save();render();scrollTo(0,0);break}
    if(id==='sports'&&!S.sports.length){toast('בחר ספורט אחד לפחות');break}
    S.onbStep++;save();render();scrollTo(0,0);break}
  case'prev':keepText();S.onbStep=Math.max(0,S.onbStep-1);save();render();break;
  case'area':{const k=t.dataset.k;S.areas=S.areas.includes(k)?S.areas.filter(x=>x!==k):[...S.areas,k];save();render();break}
  case'addarea':addArea($('#areaIn').value);save();render();break;
  case'focus':S.focus=t.dataset.k;if(SPORTS[S.focus])S.first=S.focus;save();render();break;
  case'scr':{const f=t.dataset.f;S[f]=Math.max(0,Math.min(16,S[f]+Number(t.dataset.d)));save();render();break}
  case'lang':S.lang=t.dataset.v;save();render();break;
  case'addsport':addCustom($('#customIn').value);save();render();break;
  case'oc':{keepText();const k=t.dataset.key,v=t.dataset.v;if(t.dataset.m==='1')S[k]=S[k].includes(v)?S[k].filter(x=>x!==v):[...S[k],v];else S[k]=S[k]===v?'':v;save();render();break}
  case'days':keepText();S.days=Math.max(1,Math.min(7,S.days+Number(t.dataset.d)));save();render();break;
  case'mins':S.minutes=Number(t.dataset.v);save();render();break;
  case'time':S.checkin=t.dataset.t;save();render();break;
  case'finish':{const v=$('#timeIn')?.value;if(v)S.checkin=v;S.onbSecs=Math.round((Date.now()-S.t0)/1000);S.stage='app';S.tab='home';save();render();buildAIPlan();break}
  case'energy':S.energy[today()]=t.dataset.k;save();render();break;
  case'report':openReport();break;case'sendreport':sendReport();break;
  case'food':openFood();break;
  case'foodtext':scanFood(null);break;
  case'profile':openProfile();break;
  case'live':openLivePicker();break;
  case'livefind':liveFind();break;
  case'livego':openLiveIntro(t.dataset.id,t.dataset.name);break;
  case'livestart':{const w=($('#liveWhat')?.value||'').trim();LIVE_WHAT=w;startLive(t.dataset.id,t.dataset.name)}break;
  case'livestop':stopLive();LIVE=null;break;
  case'livedone':finishLive();break;
  case'liveagain':startLive(t.dataset.id,t.dataset.name);break;
  case'liveflip':if(LIVE){LIVE.facing=LIVE.facing==='user'?'environment':'user';startCamera().catch(()=>toast('לא הצלחתי להחליף מצלמה'))}break;
  case'livefit':if(LIVE){LIVE.fullFrame=!LIVE.fullFrame;$('#liveFitBtn').textContent=LIVE.fullFrame?'⛶ מסך מלא':'⤢ כל הפריים'}break;
    case'sharerec':shareRec();break;
    case'livedeep':liveDeep();break;
    case'liveask':{closeSheet();S.tab='coach';save();render();sendChat(`עשיתי בדיקה חיה עם השלד: ${t.dataset.name}. התוצאה: ${t.dataset.sum}. תסביר לי לעומק איך לתקן ואיך להתקדם.`)}break;
  case'look':{const ty=t.dataset.type,id=t.dataset.id;S.look=S.look||{};S.look[ty]=id;save();applyLook();render();openProfile();break}
  case'closereport':closeSheet();checkNewRewards();break;
  case'talk':startTalk(+t.dataset.i);break;
  case'whatok':{const v=($('#whatIn')?.value||'').trim();const r=WHAT_RES;WHAT_RES=null;closeSheet();r&&r(v);break}
  case'whatcancel':{const r=WHAT_RES;WHAT_RES=null;closeSheet();r&&r(null);break}
  case'proof':PROOF_I=+t.dataset.i;{const inp=$('#proofIn');inp.value='';inp.click()}break;
  case'installagain':INSTALLED=false;render();break;
    case'install':if(installEvt){installEvt.prompt();installEvt.userChoice.then(c=>{if(c.outcome==='accepted'){INSTALLED=true}installEvt=null;render()})}break;
  case'msave':{const k=t.dataset.k;const el=$('#mIn_'+k);const raw=(el?.value||'').trim();
    const m=(SPORTS[k]||AREAS[k])?.metric||{};const v=m.grade?raw.toUpperCase().replace(/\s+/g,''):raw.replace(',','.');
    if(!v||(m.grade?isNaN(gradeNum(v)):isNaN(Number(v)))){toast(m.grade?'כתוב דרגה, למשל V3':'כתוב מספר');break}
    S.metrics=S.metrics||{};const E=S.metrics[k]||(S.metrics[k]=[]);const d=today();
    if(E.length&&E[E.length-1].date===d)E[E.length-1].v=v;else E.push({date:d,v});save();render();toast('נשמר');break}
  case'replan':buildAIPlan();break;
  case'steps':{const n=parseInt(($('#stepsIn').value||'').replace(/[^0-9]/g,''));if(!n){toast('הקלד מספר צעדים');break}S.steps[today()]=n;save();render();toast('הצעדים עודכנו');break}
  case'delmeal':{const M=S.meals[today()]||[];M.splice(+t.dataset.i,1);save();render();break}
  case'close':case'closebg':{const r=WHAT_RES;WHAT_RES=null;closeSheet();r&&r(null);break}
  case'say':sendChat(t.textContent);break;
  case'pain':openInjury(t.dataset.r||null);break;
  case'psport':S.psport=t.dataset.k;S.ex=null;save();render();break;
  case'ex':S.ex=t.dataset.x;save();render();break;
  case'view':IJ.view=t.dataset.v;renderInj();break;
  case'spot':{IJ.region=t.dataset.k;IJ.side=sideOf(IJ.view,+t.dataset.x,IJ.region);renderInj();break}
  case'injnext':IJ.step=1;renderInj();break;case'injback':IJ.step=0;renderInj();break;
  case'ij':{const k=t.dataset.key,v=t.dataset.v;if(t.dataset.m==='1')IJ[k]=IJ[k].includes(v)?IJ[k].filter(x=>x!==v):[...IJ[k],v];else IJ[k]=v;renderInj();break}
  case'injgo':{IJ.other=($('#injOther')?.value||IJ.other||'').trim();if(!IJ.move.length&&!(IJ.sym||[]).length&&!IJ.other){toast('בחר מה אתה מרגיש, או ספר במילים שלך מה קרה');break}runInj();break}case'injsave':saveInj();break;
  case'injagain':{const i=S.injuries.find(x=>x.id==t.dataset.id);if(i)openInjury(i.region,i);break}
  case'injbetter':{const i=S.injuries.find(x=>x.id==t.dataset.id);if(i){i.active=false;save();render();toast('מעולה! המאמן יחזיר את התרגילים בהדרגה')}break}
  case'reset':if(t.dataset.confirm){const keep={uid:S.uid,email:S.email,name:S.name};try{localStorage.removeItem(KEY)}catch(_){}S=Object.assign(fresh(),keep,USER?{stage:'onb',t0:Date.now()}:{});save();render()}else{t.dataset.confirm=1;t.textContent='בטוח? לחץ שוב';setTimeout(()=>{if(t.isConnected){delete t.dataset.confirm;t.textContent='איפוס'}},3000)}break;
  }});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='proofIn'&&t.files[0]&&PROOF_I>=0){const f=t.files[0];checkProof(f,PROOF_I)}
  if(t.id==='avatarIn'&&t.files[0]){const f=t.files[0];resizeAvatar(f).then(d=>{S.avatar=d;save();render();if($('.sheet'))openProfile();toast('התמונה נשמרה')}).catch(()=>toast('לא הצלחתי לפתוח את התמונה. נסה תמונה אחרת'))}
  if(t.dataset.act==='flag'){const v=t.dataset.v;IJ.flags=t.checked?[...IJ.flags,v]:IJ.flags.filter(x=>x!==v)}
  if(t.id==='vidIn'&&t.files[0])analyze(t.files[0]);

async function sendMedia(f){if(chatBusy)return;const box=$('#msgs');const b=document.createElement('div');b.className='msg a think';b.textContent='מכין את הסרטון…';box?.append(b);scrollTo(0,document.body.scrollHeight);let fr;
  try{fr=await grabFrames(f,Math.max(1,Math.min(4,IMG||4)))}catch(e){console.warn('video',e);b.remove();S.chat.push({role:'assistant',content:videoErr(e)});save();render();return}
  b.remove();
  const thumbs=(await Promise.all(fr.map(thumb))).filter(Boolean);const i=$('#chatIn');const pre=i.value;
  const what=await askWhat(thumbs,'מה שלחת?',pre,'למשל: ניסיון להחזקת טאק פלאנש. מה לתקן?');if(what===null)return;i.value='';
  sendChat(what,{frames:fr,thumbs,video:f.type.startsWith('video/')})}

/* ---------- updates: when a new version is published, show it and load it ---------- */
const APP_VER='20261103173423';
function updScreen(html){let d=$('#upd');if(!d){d=document.createElement('div');d.id='upd';d.className='upd';document.body.append(d)}d.innerHTML=`<div class="upd-box" dir="rtl" lang="he">${html}</div>`}
async function checkUpdate(){if(location.protocol!=='https:'||LIVE)return;let j;try{j=await (await fetch('version.json?t='+Date.now(),{cache:'no-store'})).json()}catch(e){return}
  if(!j?.ver||j.ver===APP_VER)return;const key='upd-'+j.ver;let n=0;try{n=+sessionStorage.getItem(key)||0;sessionStorage.setItem(key,n+1)}catch(e){n=9}
  if(n<2){updScreen('<div class="upd-spin">🔄</div><div class="t">האפליקציה מתעדכנת…</div><p class="small muted">רגע אחד, הכל שמור.</p>');
    try{const r=await navigator.serviceWorker?.getRegistration();await r?.update()}catch(e){}
    const q=new URLSearchParams(location.search);q.set('v',j.ver);setTimeout(()=>location.replace(location.pathname+'?'+q),700)}
  else updScreen('<div class="upd-spin">🛠️</div><div class="t">האפליקציה מתעדכנת עכשיו</div><p class="small muted">זה לוקח כמה דקות. נסה שוב בעוד 5 דקות. ההתקדמות שלך שמורה.</p><button class="btn block" onclick="location.reload()">נסה שוב</button><button class="btn block ghost" onclick="document.getElementById(\'upd\').remove()">המשך בינתיים</button>')}
(()=>{const q=new URLSearchParams(location.search);if(q.get('v')){if(q.get('v')===APP_VER)setTimeout(()=>toast('✨ האפליקציה עודכנה'),800);q.delete('v');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:''))}})();
setTimeout(checkUpdate,1500);setInterval(checkUpdate,10*60*1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
if('serviceWorker' in navigator&&location.protocol==='https:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
